<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tonneau Skeleton Studio</title>
    <style>
        body { margin: 0; padding: 0; background-color: #05070a; overflow: hidden; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        .ui-overlay { position: absolute; top: 20px; left: 20px; background: rgba(15, 20, 28, 0.85); padding: 15px; border-radius: 8px; border: 1px solid #30363d; color: #c9d1d9; pointer-events: none; }
        h1 { font-size: 1.1rem; margin: 0 0 5px 0; color: #fff; }
        p { font-size: 0.8rem; margin: 0; color: #8b949e; }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <h1>Tonneau 3D Studio</h1>
        <p>Left Click + Drag to Rotate</p>
        <p>Scroll to Zoom | Right Click to Pan</p>
    </div>

    <div id="canvas-container"></div>

    <!-- Load Three.js and OrbitControls from CDN -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>

    <script>
        // 1. Setup Scene, Camera, and WebGL Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x07090e);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        // 2. Add Orbit Controls for Interaction
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 3. Realistic Studio Lighting Map
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight1.position.set(5, 10, 7);
        dirLight1.castShadow = true;
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0x58a6ff, 1.0); // Subtle blue tech fill light
        dirLight2.position.set(-5, -5, 5);
        scene.add(dirLight2);

        // 4. Create Parametric Tonneau Profile Shape
        function createTonneauGeometry(width, height, depth) {
            const shape = new THREE.Shape();
            // Plot barrel curved path profile
            shape.moveTo(-width/2, height/2 - 0.5);
            shape.quadraticCurveTo(0, height/2, width/2, height/2 - 0.5);
            shape.quadraticCurveTo(width/2 + 0.4, 0, width/2, -height/2 + 0.5);
            shape.quadraticCurveTo(0, -height/2, -width/2, -height/2 + 0.5);
            shape.quadraticCurveTo(-width/2 - 0.4, 0, -width/2, height/2 - 0.5);

            // Cut out the inner center dial pocket hole
            const holePath = new THREE.Path();
            const iw = width * 0.8; const ih = height * 0.8;
            holePath.moveTo(-iw/2, ih/2 - 0.4);
            holePath.quadraticCurveTo(0, ih/2, iw/2, ih/2 - 0.4);
            holePath.quadraticCurveTo(iw/2 + 0.3, 0, iw/2, -ih/2 + 0.4);
            holePath.quadraticCurveTo(0, -ih/2, -iw/2, -ih/2 + 0.4);
            holePath.quadraticCurveTo(-iw/2 - 0.3, 0, -iw/2, ih/2 - 0.4);
            shape.holes.push(holePath);

            const extrudeSettings = { depth: depth, bevelEnabled: true, bevelSegments: 5, steps: 1, bevelSize: 0.05, bevelThickness: 0.05 };
            return new THREE.ExtrudeGeometry(shape, extrudeSettings);
        }

        // 5. Instantiating Physically Based Render (PBR) Materials
        const carbonMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a1f26,
            roughness: 0.3,
            metalness: 0.8,
            bumpScale: 0.05
        });

        const goldGearMaterial = new THREE.MeshStandardMaterial({
            color: 0xd4af37,
            roughness: 0.2,
            metalness: 0.9
        });

        const steelBridgeMaterial = new THREE.MeshStandardMaterial({
            color: 0x2b303b,
            roughness: 0.4,
            metalness: 0.9
        });

        const crystalMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.25,
            roughness: 0.0,
            transmission: 0.9,
            ior: 1.5,
            side: THREE.DoubleSide
        });

        // 6. Assemble Watch Core Group Architecture
        const watchGroup = new THREE.Group();

        // Add Bezel Chassis
        const bezelGeo = createTonneauGeometry(3.5, 4.5, 0.4);
        bezelGeo.center();
        const bezelMesh = new THREE.Mesh(bezelGeo, carbonMaterial);
        bezelMesh.position.z = 0.4;
        watchGroup.add(bezelMesh);

        // Add Transparent Sapphire Top Face Crystal
        const crystalGeo = createTonneauGeometry(3.4, 4.4, 0.02);
        crystalGeo.center();
        const crystalMesh = new THREE.Mesh(crystalGeo, crystalMaterial);
        crystalMesh.position.z = 0.65;
        watchGroup.add(crystalMesh);

        // Add Central Skeleton Bridges Structure
        const bridgeGeo = new THREE.BoxGeometry(0.15, 3.8, 0.1);
        const bridgeMesh1 = new THREE.Mesh(bridgeGeo, steelBridgeMaterial);
        const bridgeMesh2 = bridgeMesh1.clone();
        bridgeMesh2.rotation.z = Math.PI / 4;
        watchGroup.add(bridgeMesh1);
        watchGroup.add(bridgeMesh2);

        // Add Kinetic Mechanical Train Wheels (Gears)
        const gearGroup = new THREE.Group();
        const mainspringGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.15, 24);
        const mainspringMesh = new THREE.Mesh(mainspringGeo, steelBridgeMaterial);
        mainspringMesh.rotation.x = Math.PI / 2;
        mainspringMesh.position.set(0, 1.2, 0.1);
        gearGroup.add(mainspringMesh);

        const centerGearGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.05, 32);
        const centerGearMesh = new THREE.Mesh(centerGearGeo, goldGearMaterial);
        centerGearMesh.rotation.x = Math.PI / 2;
        centerGearMesh.position.set(0, 0, 0.15);
        gearGroup.add(centerGearMesh);

        const tourbillonGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.1, 16);
        const tourbillonMesh = new THREE.Mesh(tourbillonGeo, goldGearMaterial);
        tourbillonMesh.rotation.x = Math.PI / 2;
        tourbillonMesh.position.set(0, -1.2, 0.15);
        gearGroup.add(tourbillonMesh);

        watchGroup.add(gearGroup);
        scene.add(watchGroup);

        // 7. Execution Loop for Animations and Raytracing Realism
        function animate() {
            requestAnimationFrame(animate);

            // Rotate gears independently to mimic dynamic escapement ticking movement
            centerGearMesh.rotation.y += 0.005;
            tourbillonMesh.rotation.y -= 0.02; // Tourbillon spins faster

            // Rotate the entire watch slightly to reveal 3D depth facets automatically
            watchGroup.rotation.y = Math.sin(Date.now() * 0.0005) * 0.15;

            controls.update();
            renderer.render(scene, camera);
        }

        // Handle Responsive Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
