<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tonneau Skeleton Watch Blueprint</title>
    <style>
        :root {
            --bg-dark: #06090e;
            --panel-bg: rgba(10, 15, 23, 0.9);
            --accent-blue: #58a6ff;
            --grid-line: rgba(31, 36, 44, 0.4);
            --text-main: #c9d1d9;
        }

        body { 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-dark); 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .ui-overlay { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            background: var(--panel-bg); 
            padding: 18px; 
            border-radius: 8px; 
            border: 1px solid #30363d; 
            color: var(--text-main); 
            z-index: 10; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }

        h1 { font-size: 1.2rem; margin: 0 0 6px 0; color: #fff; letter-spacing: 0.5px; }
        p { font-size: 0.8rem; margin: 3px 0; color: #8b949e; }
        .status { color: #56d364; font-weight: bold; }

        .blueprint-container {
            width: 90%;
            height: 90%;
            max-width: 500px;
            max-height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .case-line { fill: none; stroke: var(--accent-blue); stroke-width: 2.5; }
        .inner-line { fill: none; stroke: #8b949e; stroke-width: 1.5; }
        .gear-gold { fill: none; stroke: #d4af37; stroke-width: 2; stroke-dasharray: 4 2; }
        .gear-steel { fill: none; stroke: #c9d1d9; stroke-width: 1.5; }
        .hand-hr { fill: none; stroke: #ffffff; stroke-width: 4; stroke-linecap: round; }
        .hand-min { fill: none; stroke: #ff4444; stroke-width: 2.5; stroke-linecap: round; }
        .dim-line { stroke: #ae5a5a; stroke-width: 1; stroke-dasharray: 4 4; }
        .dim-text { fill: #ae5a5a; font-size: 10px; font-family: monospace; }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <h1>Tonneau Vector Space</h1>
        <p>● Multi-Layer CAD Architecture: Active</p>
        <p>● Standalone Firewall Patch: <span class="status">Applied</span></p>
        <p>● Precision Bounding Bounds: 39mm x 48mm</p>
    </div>

    <div class="blueprint-container">
        <svg viewBox="0 0 400 500">
            <path class="case-line" d="M 110,40 Q 200,25 290,40 Q 345,250 290,460 Q 200,475 110,460 Q 55,250 110,40 Z" />
            <path class="inner-line" d="M 116,46 Q 200,32 284,46 Q 336,250 284,454 Q 200,468 116,454 Q 64,250 116,46 Z" stroke-dasharray="2 2" />

            <rect x="328" y="235" width="22" height="30" rx="3" fill="none" stroke="#444" stroke-width="1.5" />
            <line x1="312" y1="250" x2="328" y2="250" stroke="#666" stroke-width="2" />

            <circle cx="200" cy="140" r="45" class="gear-steel" />
            <circle cx="200" cy="140" r="39" class="gear-gold" />
            <circle cx="200" cy="140" r="6" fill="#ff2255" />

            <circle cx="200" cy="250" r="28" class="gear-steel" />
            <circle cx="200" cy="250" r="24" class="gear-gold" />

            <circle cx="200" cy="355" r="35" class="inner-line" />
            <line x1="170" y1="355" x2="230" y2="355" stroke="#58a6ff" stroke-width="1" opacity="0.6" />
            <line x1="200" y1="325" x2="200" y2="385" stroke="#58a6ff" stroke-width="1" opacity="0.6" />
            <circle cx="200" cy="355" r="10" fill="none" stroke="#ff4444" stroke-width="1.5" />

            <path d="M 125,100 L 275,100 M 100,250 L 140,250 M 260,250 L 300,250 M 125,395 L 275,395 M 200,100 L 200,395" fill="none" stroke="var(--accent-blue)" stroke-width="2" opacity="0.7" />

            <g fill="none" stroke="var(--accent-blue)" stroke-width="1.2">
                <circle cx="130" cy="50" r="3.5" /><circle cx="175" cy="42" r="3.5" /><circle cx="225" cy="42" r="3.5" /><circle cx="270" cy="50" r="3.5" />
                <circle cx="130" cy="450" r="3.5" /><circle cx="175" cy="458" r="3.5" /><circle cx="225" cy="458" r="3.5" /><circle cx="270" cy="450" r="3.5" />
                <circle cx="82" cy="200" r="3.5" /><circle cx="82" cy="300" r="3.5" /><circle cx="318" cy="200" r="3.5" /><circle cx="318" cy="300" r="3.5" />
            </g>

            <g filter="drop-shadow(0px 5px 5px rgba(0,0,0,0.5))">
                <circle cx="200" cy="250" r="5" fill="#fff" />
                <path class="hand-hr" d="M 200,250 L 200,175" />
                <path class="hand-min" d="M 200,250 L 265,205" />
            </g>

            <g>
                <line x1="55" y1="485" x2="345" y2="485" class="dim-line" />
                <line x1="55" y1="480" x2="55" y2="490" stroke="#ae5a5a" />
                <line x1="345" y1="480" x2="345" y2="490" stroke="#ae5a5a" />
                <text x="170" y="498" class="dim-text">W: 39.00 mm</text>

                <line x1="25" y1="40" x2="25" y2="460" class="dim-line" />
                <line x1="20" y1="40" x2="30" y2="40" stroke="#ae5a5a" />
                <line x1="20" y1="460" x2="30" y2="460" stroke="#ae5a5a" />
                <text x="12" y="255" class="dim-text" transform="rotate(-90 12 255)">L: 48.00 mm</text>
            </g>
        </svg>
    </div>

</body>
</html>
