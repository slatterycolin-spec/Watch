<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tonneau Watch Laboratory</title>
    <style>
        body { margin: 0; padding: 0; background-color: #06090e; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; z-index: 1; }
        .ui-overlay { position: absolute; top: 20px; left: 20px; background: rgba(10, 15, 23, 0.9); padding: 18px; border-radius: 8px; border: 1px solid #30363d; color: #c9d1d9; pointer-events: none; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-size: 1.2rem; margin: 0 0 6px 0; color: #fff; letter-spacing: 0.5px; }
        p { font-size: 0.8rem; margin: 3px 0; color: #8b949e; display: flex; align-items: center; gap: 6px; }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <h1>Tonneau 3D Space</h1>
        <p>● Left Click + Drag to Rotate Case</p>
        <p>● Scroll Wheel to Zoom In/Out</p>
        <p>● Network Filter Patch: Applied</p>
    </div>

    <div id="canvas-container"></div>

    <!-- Swapped to UNPKG servers to bypass firewall script blockers -->
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>

    <script>
        // Catch network failure if libraries are completely severed
        if (typeof THREE === 'undefined') {
            document.querySelector('.ui-overlay').innerHTML = "<h1>Network Connection Error</h1><p style='color:#ff4444;'>Your network is actively blocking external 3D libraries (Three.js). Try loading this page on a personal device or mobile network.</p>";
        } else {
            // Core WebGL Setup
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x06090e);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 8);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const lightLeft = new THREE.DirectionalLight(0xffffff, 1.2);
            lightLeft.position.set(5, 8, 5);
            scene.add(lightLeft);

            const lightRight = new THREE.DirectionalLight(0x58a6ff, 1.5);
            lightRight.position.set(-5, -4, 4);
            scene.add(lightRight);

            const carbonMat = new THREE.MeshStandardMaterial({ color: 0x1f242c, roughness: 0.3, metalness: 0.7 });
            const goldGearMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.1, metalness: 0.9 });
            const gunmetalMat = new THREE.MeshStandardMaterial({ color: 0x2d323b, roughness: 0.4, metalness: 0.85 });
            const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.15, roughness: 0.0, transmission: 0.9, thickness: 0.05 });

            const watchMaster = new THREE.Group();

            const caseOuterGeo = new THREE.BoxGeometry(2.8, 3.6, 0.6);
            const caseOuterMesh = new THREE.Mesh(caseOuterGeo, carbonMat);
            watchMaster.add(caseOuterMesh);

            const corePlatGeo = new THREE.BoxGeometry(2.5, 3.3, 0.4);
            const corePlatMesh = new THREE.Mesh(corePlatGeo, gunmetalMat);
            corePlatMesh.position.z = -0.05;
            watchMaster.add(corePlatMesh);

            const gear1Geo = new THREE.CylinderGeometry(0.55, 0.55, 0.08, 24);
            const gear1 = new THREE.Mesh(gear1Geo, goldGearMat);
            gear1.rotation.x = Math.PI / 2;
            gear1.position.set(0, 0.7, 0.18);
            watchMaster.add(gear1);

            const gear2Geo = new THREE.CylinderGeometry(0.45, 0.45, 0.05, 20);
            const gear2 = new THREE.Mesh(gear2Geo, goldGearMat);
            gear2.rotation.x = Math.PI / 2;
            gear2.position.set(0, -0.7, 0.18);
            watchMaster.add(gear2);

            const hrHandGeo = new THREE.BoxGeometry(0.06, 0.5, 0.02);
            hrHandGeo.translate(0, 0.25, 0);
            const hrHand = new THREE.Mesh(hrHandGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
            hrHand.position.set(0, 0, 0.23);
            hrHand.rotation.z = Math.PI / 3;
            watchMaster.add(hrHand);

            const minHandGeo = new THREE.BoxGeometry(0.04, 0.8, 0.02);
            minHandGeo.translate(0, 0.4, 0);
            const minHand = new THREE.Mesh(minHandGeo, new THREE.MeshBasicMaterial({ color: 0xff4444 }));
            minHand.position.set(0, 0, 0.25);
            minHand.rotation.z = Math.PI / 1.3;
            watchMaster.add(minHand);

            const crystalGeo = new THREE.BoxGeometry(2.6, 3.4, 0.02);
            const crystalMesh = new THREE.Mesh(crystalGeo, glassMat);
            crystalMesh.position.z = 0.32;
            watchMaster.add(crystalMesh);

            scene.add(watchMaster);

            function animate() {
                requestAnimationFrame(animate);
                gear1.rotation.y += 0.004;
                gear2.rotation.y -= 0.012;
                watchMaster.rotation.y = Math.sin(Date.now() * 0.0005) * 0.25;
                watchMaster.rotation.x = Math.cos(Date.now() * 0.0005) * 0.12;
                controls.update();
                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }
    </script>
</body>
</html>
